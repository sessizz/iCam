name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS app + camera extension
            scheme: iCam (macOS)
            destination: generic/platform=macOS
          - name: iPhone app
            scheme: iCam (iOS)
            destination: generic/platform=iOS
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project iCam.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log | grep -E "(error|warning):|BUILD (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -100

  protocol-tests:
    name: Protocol tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run
        run: swiftc -parse-as-library -O Shared/ICamProtocol.swift Shared/MessageFraming.swift Tests/ProtocolTests.swift -o protocol-tests && ./protocol-tests

  pipeline-tests:
    name: Video pipeline tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Encode → wire → decode
        run: |
          swiftc -parse-as-library -O Shared/*.swift macOS/Shared/*.swift \
            iOS/Sources/VideoEncoder.swift macOS/App/Sources/VideoDecoder.swift \
            macOS/App/Sources/VideoPipeline.swift Tests/PipelineTests.swift -o pipeline-tests
          ./pipeline-tests
